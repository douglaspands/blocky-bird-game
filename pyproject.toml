[project]
name = "blocky-bee"
version = "0.1.0"
description = "Flappy Bird com tematica Minecraft em Python/Pygame — graficos e sons gerados por codigo, sem assets externos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame-ce>=2.5",
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "ty>=0.0.65",
]

[tool.ruff]
line-length = 110
target-version = "py310"
# p4a-recipes: copiado de um PR upstream do python-for-android (task 27/28), nao e
# codigo deste projeto — mesma exclusao ja usada por [tool.ty.src].
extend-exclude = ["specs", "p4a-recipes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Docstrings (R31) cobrem src/, scripts/, main.py e conftest.py — nao os testes.
"tests/*.py" = ["D"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
exclude = ["p4a-recipes", "specs", ".buildozer", "build", "dist"]
