name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync

      - name: Build site (mkdocs build --strict)
        run: uv run mkdocs build --strict

      - name: Cache runtime WebAssembly vendorizado (task 91, ~21.9 MiB)
        uses: actions/cache@v4
        with:
          path: .cache/pygbag-runtime
          key: pygbag-runtime-${{ hashFiles('scripts/build_web.py') }}

      - name: Build web (pygbag --build + inline_assets, R40.1/R40.2/R40.5)
        run: uv run python scripts/build_web.py

      - name: Publica o jogo em site/play/ (R41.1 — mesma implantacao do site de docs)
        run: |
          mkdir -p site/play
          cp dist/BlockyBee.html site/play/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
