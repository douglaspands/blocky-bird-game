name: Release build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (Windows)
        if: runner.os == 'Windows'
        run: powershell -c "irm https://astral.sh/uv/install.ps1 | iex"

      - name: Install uv (Linux)
        if: runner.os == 'Linux'
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync

      - name: Build executable
        run: uv run pyinstaller BlockyBee.spec

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/BlockyBee.exe -DestinationPath BlockyBee-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.event.release.tag_name }}.zip

      - name: Package Linux build
        if: runner.os == 'Linux'
        run: tar -cjf BlockyBee-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.event.release.tag_name }}.tar.bz2 -C dist BlockyBee

      - name: Upload Windows asset
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: BlockyBee-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.event.release.tag_name }}.zip

      - name: Upload Linux asset
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          files: BlockyBee-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.event.release.tag_name }}.tar.bz2

  build-apk:
    # Job independente: uma falha aqui nao deve impedir a publicacao dos
    # binarios de desktop do job acima (a cadeia de build Android e a parte
    # mais fragil do projeto, ver specs/v2/design.md secao 24.1).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache buildozer state (Android SDK/NDK, p4a, build intermedio)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec', 'p4a-recipes/**') }}
          restore-keys: |
            buildozer-

      - name: Build APK (Buildozer via Docker, SDK/NDK reprodutiveis)
        run: |
          docker pull kivy/buildozer
          # -v "$HOME/.buildozer": SDK/NDK baixados pelo buildozer (imagem oficial
          # os mantem fora do hostcwd, ver docs kivy/buildozer no Docker Hub).
          # buildozer recusa rodar como root sem confirmacao interativa; "yes y"
          # tambem cobre a aceitacao das licencas do Android SDK no primeiro build.
          yes y | docker run --rm -i \
            -v "$HOME/.buildozer:/home/user/.buildozer" \
            -v "${{ github.workspace }}:/home/user/hostcwd" \
            kivy/buildozer android debug

      - name: Rename APK sem comprimir
        # APK "fat" com multiplas ABIs (android.archs no buildozer.spec),
        # por isso "universal" em vez de uma arquitetura unica.
        run: |
          apk=$(find bin -maxdepth 1 -name '*.apk' | head -n1)
          cp "$apk" "BlockyBee-android-universal-${{ github.event.release.tag_name }}.apk"

      - name: Upload APK asset (uncompressed)
        uses: softprops/action-gh-release@v2
        with:
          files: BlockyBee-android-universal-${{ github.event.release.tag_name }}.apk
